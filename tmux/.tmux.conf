set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g mouse on
set-option -g set-clipboard on

# set vi options
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

bind C-l send-keys 'C-l' # use C-b C-l to clear screen as C-l is used by vim

bind C-n select-window -n
bind C-p select-window -p
bind N select-window -p

# switch to window N, i3/sway Mod+number style
# (note: shadows readline's Alt+digit "digit-argument" inside tmux panes)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# resize the active pane (prefix, then repeat H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# move (swap) panes in a direction, i3/sway Mod+Shift+hjkl style
# (no prefix, mirrors Ctrl+hjkl nav from vim-tmux-navigator below)
bind -n M-H swap-pane -t '{left-of}'
bind -n M-J swap-pane -t '{down-of}'
bind -n M-K swap-pane -t '{up-of}'
bind -n M-L swap-pane -t '{right-of}'

# send the active pane to window N, i3/sway "move to workspace N" style
# (-d keeps focus on the current window, like i3's default; target window
# must already exist)
bind -n 'M-!' join-pane -d -t :1
bind -n 'M-@' join-pane -d -t :2
bind -n 'M-#' join-pane -d -t :3
bind -n 'M-$' join-pane -d -t :4
bind -n 'M-%' join-pane -d -t :5
bind -n 'M-^' join-pane -d -t :6
bind -n 'M-&' join-pane -d -t :7
bind -n 'M-*' join-pane -d -t :8
bind -n 'M-(' join-pane -d -t :9

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# style the bar
set-option -g status-position bottom
# set-option -g status-right "%a %d %b %I:%M %p"
# Colours here are ANSI palette *indices*, not hex, so the terminal resolves
# them against whatever theme is currently active -- the bar follows Ghostty's
# light/dark switch for free, with no tmux theme support required.
#   default -> terminal bg/fg    colour4 -> blue accent    colour8 -> muted gray
# (Avoid the name `black`: it means index 0, which is a mid gray in GitHub Dark.)
set -g status-style "bg=default,fg=default"
setw -g window-status-current-style "fg=colour4 bold"
setw -g window-status-style "fg=colour8"
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, Z,} "
setw -g window-status-format " #I:#W#{?window_zoomed_flag, Z,} "
# set -g status-justify centre
# set -g status-left-length 80
# set -g status-left '#[bold]>>> #S'
# set -g pane-border-style fg=#171b1f
# set -g pane-active-border-style "bg=#171b1f fg=#171b1f"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "bg=default fg=colour4"
set -g pane-border-lines heavy

# tmux defaults these to bg=yellow,fg=black, which breaks in light mode: the
# palette's yellow (index 3) is a dark brown in GitHub Light -- it's tuned to be
# readable *as text on white*, not as a background -- so black-on-brown goes
# unreadable.
# This bar overdraws the window tabs, so unlike the status line it needs an
# opaque background. That rules out palette indices: whatever we pick has to
# stay legible under *both* themes rather than follow either one, so these are
# absolute hex. Neutral slate + white reads as a deliberate overlay on the
# white and the near-black background alike (~9:1 contrast either way).
# `fill` is the one that paints the rest of the line past the message; `bg`
# alone only covers the glyphs and leaves the tabs showing through the gap.
set -g message-style "bg=#3d444d,fg=#ffffff,bold,fill=#3d444d"
set -g message-command-style "bg=#3d444d,fg=#ffffff,bold,fill=#3d444d"
# A selection does need a real background, so invert the terminal's own
# fg/bg -- guaranteed contrast in whichever theme is active.
setw -g mode-style "reverse"

# sesh recommended
set -g detach-on-destroy off

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell '~/.tmux/plugins/tpm/tpm'


